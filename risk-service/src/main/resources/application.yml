server:
  port: ${SERVER_PORT:18102}

spring:
  application:
    name: risk-service
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27018/risk}
  data:
    mongodb:
      # Creates the indexes declared on RiskAssessmentDocument (card + time, customer + device).
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
    consumer:
      group-id: risk-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 3000
        delivery.timeout.ms: 8000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

smartcheckout:
  kafka:
    partitions: 6
    replicas: 1
    send-timeout-ms: 10000
