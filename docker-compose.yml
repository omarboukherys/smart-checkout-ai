# Local infrastructure for Smart Checkout AI.
# Host ports are shifted (15432, 27018, 19092, 18190) so the stack can run next to other projects.
name: smartcheckout

services:
  postgres:
    image: postgres:17-alpine
    container_name: sc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartcheckout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcheckout}
      POSTGRES_DB: smartcheckout
    ports:
      - "15432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # One database per service (checkout, payment): no service reads another one's tables.
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d smartcheckout"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:8.0
    container_name: sc-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.1.0
    container_name: sc-kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL for containers (kafka:9092), EXTERNAL for the host and the IDE (localhost:19092).
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the services themselves (partitions, retention), never created by accident.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: sc-kafka-ui
    ports:
      - "18190:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartcheckout
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # --- Application services: started only with "docker compose --profile app up -d --build".
  # Without the profile, run them from the IDE against the infrastructure above.
  checkout-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE: checkout-service
    image: smartcheckout/checkout-service:local
    container_name: sc-checkout-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/checkout
      DB_USER: ${POSTGRES_USER:-smartcheckout}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-smartcheckout}
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "18101:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  risk-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE: risk-service
    image: smartcheckout/risk-service:local
    container_name: sc-risk-service
    environment:
      MONGO_URI: mongodb://mongodb:27017/risk
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "18102:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  payment-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/java-service.Dockerfile
      args:
        SERVICE: payment-service
    image: smartcheckout/payment-service:local
    container_name: sc-payment-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment
      DB_USER: ${POSTGRES_USER:-smartcheckout}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-smartcheckout}
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "18103:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pg-data:
  mongo-data:
